[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "badit-tf"
version = "0.1.0"
description = "Task-Fisher ability partitioning experiments for multi-task and continual learning"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<3",
  "scipy>=1.11,<2",
  "scikit-learn>=1.3,<2",
  "PyYAML>=6,<7",
  "openpyxl>=3.1,<4",
  "nltk>=3.8,<4",
]

[project.optional-dependencies]
train = [
  "torch>=2.4",
  "transformers>=4.45,<5",
  "accelerate>=1.0,<2",
  "datasets>=3,<6",
  "deepspeed>=0.15,<0.20",
]
test = ["pytest>=8,<9"]

[project.scripts]
badit-tf = "badit_tf.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

